<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🏴‍☠️ 寻宝游戏 · 异步大冒险</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
    color: #f0e6d2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px;
    overflow-x: hidden;
  }
  h1 {
    font-size: 2rem;
    text-shadow: 0 0 15px #ffd700;
    margin-bottom: 6px;
    animation: glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 8px #ffd700; }
    to   { text-shadow: 0 0 25px #ffd700, 0 0 40px #ff8c00; }
  }
  .subtitle { opacity: .7; margin-bottom: 25px; font-size: .9rem; }

  /* ===== 地图舞台 ===== */
  .stage {
    position: relative;
    width: min(860px, 95vw);
    height: 340px;
    background: radial-gradient(ellipse at center, #3d2b1f 0%, #241a12 80%);
    border: 6px solid #8b5a2b;
    border-radius: 18px;
    box-shadow: inset 0 0 60px rgba(0,0,0,.6), 0 10px 40px rgba(0,0,0,.5);
    overflow: hidden;
  }
  .stage::after { /* 旧纸纹理 */
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,215,0,.06) 0 12%, transparent 13%),
      radial-gradient(circle at 75% 60%, rgba(255,215,0,.05) 0 18%, transparent 19%);
    pointer-events: none;
  }
  /* 虚线路径 */
  .path {
    position: absolute;
    top: 55%; left: 6%;
    width: 88%;
    border-top: 3px dashed rgba(240, 230, 210, .35);
    z-index: 1;
  }
  /* 站点 */
  .spot {
    position: absolute;
    top: 55%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 2;
    opacity: .35;
    transition: opacity .5s, transform .5s;
  }
  .spot .icon { font-size: 2.2rem; display: block; }
  .spot .name { font-size: .72rem; margin-top: 4px; opacity: .85; }
  .spot.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.15);
    filter: drop-shadow(0 0 12px #ffd700);
  }
  .spot.done { opacity: .9; transform: translate(-50%, -50%) scale(1); }
  .spot.fail { filter: drop-shadow(0 0 10px #ff4444); opacity: 1; }

  /* 探险者 */
  #hero {
    position: absolute;
    top: 55%;
    left: 6%;
    transform: translate(-50%, -130%);
    font-size: 2rem;
    z-index: 3;
    transition: left 2.5s ease-in-out;
    animation: bounce 1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -8px; }
  }
  #hero.walking { animation: bounce .5s ease-in-out infinite; }

  /* 天气/氛围粒子 */
  .firefly {
    position: absolute;
    width: 4px; height: 4px;
    background: #ffd700;
    border-radius: 50%;
    opacity: 0;
    animation: float 6s linear infinite;
    z-index: 1;
  }
  @keyframes float {
    0%   { transform: translateY(0);       opacity: 0; }
    20%  { opacity: .8; }
    100% { transform: translateY(-120px); opacity: 0; }
  }

  /* ===== 日志面板 ===== */
  .panel {
    width: min(860px, 95vw);
    margin-top: 20px;
    background: rgba(0,0,0,.45);
    border: 1px solid #8b5a2b;
    border-radius: 12px;
    padding: 14px 18px;
    height: 220px;
    overflow-y: auto;
    font-size: .92rem;
    line-height: 1.8;
  }
  .panel p { animation: slideIn .4s ease; }
  @keyframes slideIn {
    from { transform: translateX(-15px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .log-info  { color: #e8d8b0; }
  .log-warn  { color: #ffb347; }
  .log-error { color: #ff6b6b; }
  .log-good  { color: #7bed9f; font-weight: bold; }

  /* ===== 按钮 ===== */
  #startBtn {
    margin-top: 18px;
    padding: 12px 42px;
    font-size: 1.05rem;
    letter-spacing: 2px;
    color: #241a12;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(255, 180, 0, .45);
    transition: transform .2s, box-shadow .2s;
  }
  #startBtn:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); }
  #startBtn:disabled { opacity: .5; cursor: not-allowed; }

  /* 胜利彩带 */
  .confetti {
    position: fixed;
    top: -20px;
    font-size: 1.4rem;
    animation: fall linear forwards;
    z-index: 99;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); }
  }
</style>
</head>
<body>
  <h1>🏴‍☠️ 寻宝游戏 · 异步大冒险</h1>
  <p class="subtitle">async / await 驱动的寻宝之旅 —— 新增护身符、回声峡谷、石门谜题三大情节</p>

  <div class="stage" id="stage">
    <div class="path"></div>
    <div id="hero">🧭</div>
  </div>

  <div class="panel" id="log"></div>
  <button id="startBtn">开始寻宝 ✨</button>

<script src="treasure-async.js"></script>
<script>
  // ===== 场景站点配置 =====
  const SPOTS = [
    { id: "library", icon: "📚", name: "古老图书馆", left: 6  },
    { id: "sage",    icon: "🧙", name: "神秘老者",   left: 21 },
    { id: "valley",  icon: "⛰️", name: "回声峡谷",   left: 36 },
    { id: "gate",    icon: "🚪", name: "石门谜题",   left: 51 },
    { id: "temple",  icon: "🏛️", name: "古老神庙",   left: 66 },
    { id: "box",     icon: "🎁", name: "神秘宝箱",   left: 81 },
    { id: "gold",    icon: "💎", name: "传说宝藏",   left: 94 },
  ];

  const stage   = document.getElementById("stage");
  const hero    = document.getElementById("hero");
  const logBox  = document.getElementById("log");
  const startBtn= document.getElementById("startBtn");

  // 初始化站点
  SPOTS.forEach(s => {
    const el = document.createElement("div");
    el.className = "spot";
    el.id = "spot-" + s.id;
    el.style.left = s.left + "%";
    el.innerHTML = `<span class="icon">${s.icon}</span><span class="name">${s.name}</span>`;
    stage.appendChild(el);
  });
  // 萤火虫氛围
  for (let i = 0; i < 14; i++) {
    const f = document.createElement("div");
    f.className = "firefly";
    f.style.left = Math.random() * 100 + "%";
    f.style.top  = (40 + Math.random() * 50) + "%";
    f.style.animationDelay = Math.random() * 6 + "s";
    stage.appendChild(f);
  }

  const log = (text, cls = "log-info") => {
    const p = document.createElement("p");
    p.className = cls;
    p.textContent = text;
    logBox.appendChild(p);
    logBox.scrollTop = logBox.scrollHeight;
  };

  const wait = (ms) => new Promise(r => setTimeout(r, ms));

  // 探险者走到某个站点
  async function walkTo(spotId, ms = 2500) {
    const spot = SPOTS.find(s => s.id === spotId);
    hero.classList.add("walking");
    hero.style.left = spot.left + "%";
    await wait(ms);
    hero.classList.remove("walking");
    document.getElementById("spot-" + spotId).classList.add("active");
  }
  const markDone = (id) => document.getElementById("spot-" + id).classList.replace("active", "done");
  const markFail = (id) => document.getElementById("spot-" + id).classList.add("fail");

  // 胜利彩带
  function confetti() {
    const emojis = ["🎉", "💰", "💎", "🪙", "✨", "🏆"];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = Math.random() * 100 + "vw";
      c.style.animationDuration = (2.5 + Math.random() * 2) + "s";
      c.style.animationDelay = Math.random() * 1.5 + "s";
      document.body.appendChild(c);
    }
  }

  // ===== async/await 寻宝主流程 =====
  async function findTreasure() {
    startBtn.disabled = true;
    logBox.innerHTML = "";
    log("🏴‍☠️ 寻宝之旅开始!你是这片大陆最后一位寻宝人...");

    try {
      // 1. 图书馆获取线索
      await walkTo("library");
      const clue = await TreasureMap.getInitialClue();
      log("📖 " + clue);
      markDone("library");

      // 2. 解码
      const location = await TreasureMap.decodeAncientScript(clue);
      log("🔑 " + location);
      markDone("library");

      // 3. 新情节:神秘老者(可选,失败不中断)
      let hasAmulet = false;
      try {
        await walkTo("sage");
        const gift = await TreasureMap.meetOldSage();
        log("🧙 " + gift + " (可在神庙中抵挡一次守卫!)", "log-good");
        hasAmulet = true;
        markDone("sage");
      } catch (err) {
        log("🚪 未能见到老者: " + err.message + " (不影响寻宝,继续前进)", "log-warn");
        markFail("sage");
      }

      // 4. 新情节:回声峡谷并发收集宝石
      await walkTo("valley");
      log("⛰️ 踏入回声峡谷,同时向三个方向派出探查...");
      const valleyMsg = await TreasureMap.crossEchoValley();
      log("✨ " + valleyMsg, "log-good");
      markDone("valley");

      // 5. 新情节:石门谜题(最多重试3次)
      await walkTo("gate");
      let doorOpen = null;
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          doorOpen = await TreasureMap.solveRiddle(attempt);
          break;
        } catch (err) {
          log("🚪 " + err.message, "log-warn");
        }
      }
      if (!doorOpen) throw new Error("三次谜题均未解开,寻宝失败...");
      log("🔓 " + doorOpen, "log-good");
      markDone("gate");

      // 6. 神庙搜索(护身符可抵挡最多三次守卫)
      await walkTo("temple");
      let box = null;
      const maxTries = hasAmulet ? 3 : 1;
      for (let i = 0; i < maxTries; i++) {
        try {
          box = await TreasureMap.searchTemple(location);
          break;
        } catch (err) {
          log("👹 " + err.message, "log-error");
          if (hasAmulet && i < maxTries - 1) {
            log("🧿 护身符发出耀眼光芒,击退守卫!鼓起勇气再次搜索...", "log-warn");
          }
        }
      }
      if (!box) throw new Error("神庙搜索失败,被守卫赶了出来...");
      log("🏛️ " + box, hasAmulet ? "log-good" : "log-info");
      markDone("temple");

      // 7. 开箱
      await walkTo("box");
      const treasure = await TreasureMap.openTreasureBox();
      log("🎁 " + treasure, "log-good");
      markDone("box");

      // 8. 胜利
      await walkTo("gold", 1800);
      hero.textContent = "🤩";
      log("💎 传说中的宝藏重见天日!你的名字将被写进史诗!", "log-good");
      markDone("gold");
      confetti();
    } catch (error) {
      log("💀 任务失败: " + error.message, "log-error");
      hero.textContent = "😵";
    } finally {
      startBtn.disabled = false;
      startBtn.textContent = "再来一次 🔁";
    }
  }

  startBtn.addEventListener("click", () => {
    hero.textContent = "🧭";
    hero.style.left = "6%";
    document.querySelectorAll(".spot").forEach(s => s.className = "spot");
    findTreasure();
  });
</script>
</body>
</html>
